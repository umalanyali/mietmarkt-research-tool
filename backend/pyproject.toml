[project]
name = "mietmarkt-research"
version = "0.1.0"
description = "Recherche-Tool für Neubau-Mietmarktanalysen (Backend und Fachpaket)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlmodel>=0.0.22",
  "pyyaml>=6",
  "python-dotenv>=1",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pydantic-settings>=2.6",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[tool.setuptools]
packages = ["mietmarkt", "mietmarkt.demo", "mietmarkt.geo", "mietmarkt.agenten", "api"]

[tool.setuptools.package-data]
"mietmarkt.demo" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-Tests rufen Claude wirklich auf (kostet Geld); nur ausdrücklich mit `pytest -m live`
addopts = "-m 'not live'"
markers = ["live: echter Aufruf der Anthropic-API, braucht ANTHROPIC_API_KEY"]

[tool.ruff]
line-length = 110
target-version = "py312"
