[project]
name = "mietmarkt-research"
version = "0.1.0"
description = "Recherche-Tool für Neubau-Mietmarktanalysen (Backend und Fachpaket)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlmodel>=0.0.22",
  "pyyaml>=6",
  "python-dotenv>=1",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[tool.setuptools]
packages = ["mietmarkt", "mietmarkt.demo", "api"]

[tool.setuptools.package-data]
"mietmarkt.demo" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
